          description: >-
            Validation failed — thiếu profileId/không phải UUID, hoặc thiếu cả
            displayName và avatarUrl, hoặc field sai kiểu
          content:
            application/json:
              schema:
                properties:
                  statusCode:
                    type: number
                    example: 400
                  message:
                    type: array
                    items:
                      type: string
                  error:
                    type: string
                    example: Bad Request
        '401':
          description: Thiếu/sai/hết hạn access token (Authorization header)
          content:
            application/json:
              schema:
                properties:
                  statusCode:
                    type: number
                    example: 401
                  message:
                    type: string
        '404':
          description: >-
            Không tìm thấy account, hoặc profileId không tồn tại/không thuộc
            account đang gọi, hoặc avatarUrl không phải file hợp lệ trong TMP
          content:
            application/json:
              schema:
                properties:
                  statusCode:
                    type: number
                    example: 404
                  code:
                    type: string
                    enum:
                      - ACCOUNT_NOT_FOUND
                      - PROFILE_NOT_FOUND
                      - AVATAR_SOURCE_NOT_FOUND
                  message:
                    type: string
                  extra:
                    type: object
                    nullable: true
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                properties:
                  statusCode:
                    type: number
                    example: 500
                  message:
                    type: string
                    example: Internal server error
      security:
        - access-token: []
      summary: >-
        Cập nhật displayName/avatarUrl của 1 profile thuộc account đang đăng
        nhập
      tags: *ref_0
