                  data:
                    type: object
                    nullable: true
                    example: null
        '401':
          description: Thiếu/sai/hết hạn access token (Authorization header)
          content:
            application/json:
              schema:
                properties:
                  statusCode:
                    type: number
                    example: 401
                  message:
                    type: string
      security:
        - access-token: []
      summary: Đánh dấu tất cả thông báo của user hiện tại đã đọc
      tags: *ref_3
  /likes:
    post:
      operationId: LikeController_toggle
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToggleLikeRequestDto'
      responses:
        '200':
          description: Toggle like/unlike thành công
          content:
            application/json:
              schema:
                properties:
                  data:
                    type: object
                    nullable: true
                    example: null
                  meta:
                    type: object
                    additionalProperties: true
                    nullable: true
        '400':
          description: Validation failed — postId thiếu hoặc không phải UUID
          content:
            application/json:
              schema:
                properties:
                  statusCode:
                    type: number
                    example: 400
                  message:
                    type: array
                    items:
                      type: string
                  error:
                    type: string
                    example: Bad Request
        '401':
          description: Thiếu/sai/hết hạn access token (Authorization header)
          content:
            application/json:
              schema:
                properties:
                  statusCode:
                    type: number
                    example: 401
                  message:
                    type: string
        '404':
          description: Post không tồn tại
          content:
            application/json:
              schema:
                properties:
                  statusCode:
                    type: number
                    example: 404
                  code:
                    type: string
                    example: POST_NOT_FOUND
                  message:
                    type: string
                  extra:
                    type: object
                    nullable: true
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                properties:
                  statusCode:
                    type: number
                    example: 500
                  message:
                    type: string
                    example: Internal server error
      security:
        - access-token: []
      summary: 'Toggle like/unlike 1 post: chưa like thì tạo like, đã like thì bỏ like'
      tags:
        - like
  /chats/rooms:
    get:
      operationId: ChatController_getRooms
      parameters: []
      responses:
        '200':
          description: Danh sách room, kèm thông tin đối phương và tin nhắn gần nhất
          content:
            application/json:
              schema:
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ChatRoomResponseDto'
                  meta:
                    type: object
                    additionalProperties: true
                    nullable: true
        '401':
          description: Thiếu/sai/hết hạn access token (Authorization header)
          content:
            application/json:
              schema:
                properties:
                  statusCode:
                    type: number
                    example: 401
                  message:
                    type: string
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                properties:
                  statusCode:
                    type: number
                    example: 500
                  message:
                    type: string
                    example: Internal server error
      security:
        - access-token: []
      summary: >-
        Lấy danh sách room chat của tôi (cả khi tôi là chủ post lẫn khi tôi là
        người nhắn tin), sắp xếp theo tin nhắn mới nhất
      tags: &ref_4
        - chat
  /chats/messages:
    get:
      operationId: ChatController_getMessages
      parameters:
        - name: postId
          required: true
          in: query
          schema:
            type: string
        - name: buyerProfileId
          required: true
          in: query
          schema:
            type: string
        - name: page
          required: false
          in: query
          schema:
            default: 1
            type: number
        - name: limit
          required: false
          in: query
          schema:
            default: 20
            type: number
      responses:
        '200':
          description: Danh sách tin nhắn của room, sắp xếp theo thời gian tăng dần
          content:
            application/json:
              schema:
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ChatMessageResponseDto'
                  meta:
                    type: object
                    additionalProperties: true
                    nullable: true
        '400':
          description: >-
            Validation failed (thiếu postId/buyerProfileId hoặc page/limit sai
            kiểu), hoặc chủ post tự nhắn tin với chính mình
            (SELF_CHAT_NOT_ALLOWED)
          content:
            application/json:
              schema:
                properties:
                  statusCode:
                    type: number
                    example: 400
                  code:
                    type: string
                    enum:
                      - SELF_CHAT_NOT_ALLOWED
                  message:
                    type: string
                  extra:
                    type: object
                    nullable: true
        '401':
          description: Thiếu/sai/hết hạn access token (Authorization header)
          content:
            application/json:
              schema:
                properties:
                  statusCode:
                    type: number
                    example: 401
                  message:
                    type: string
        '403':
          description: >-
            Người gọi không phải chủ post cũng không phải người nhắn tin của
            room này (CHAT_PARTICIPANT_FORBIDDEN)
          content:
            application/json:
              schema:
                properties:
                  statusCode:
                    type: number
                    example: 403
                  code:
                    type: string
                    example: CHAT_PARTICIPANT_FORBIDDEN
                  message:
                    type: string
                  extra:
                    type: object
                    nullable: true
        '404':
          description: Post không tồn tại (POST_NOT_FOUND)
          content:
            application/json:
              schema:
                properties:
                  statusCode:
                    type: number
                    example: 404
                  code:
                    type: string
                    example: POST_NOT_FOUND
                  message:
                    type: string
                  extra:
                    type: object
                    nullable: true
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                properties:
                  statusCode:
                    type: number
                    example: 500
                  message:
                    type: string
                    example: Internal server error
      security:
        - access-token: []
      summary: Lấy lịch sử tin nhắn của 1 room (postId + buyerProfileId), có phân trang
      tags: *ref_4
  /chats/rooms/read:
    post:
      operationId: ChatController_markRoomAsRead
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkChatAsReadRequestDto'
      responses:
        '200':
          description: Đánh dấu đã đọc thành công
          content:
            application/json:
              schema:
                properties:
                  data:
                    type: object
                    nullable: true
                    example: null
        '400':
          description: >-
            Validation failed (thiếu postId/buyerProfileId), hoặc chủ post tự
            nhắn tin với chính mình (SELF_CHAT_NOT_ALLOWED)
          content:
            application/json:
              schema:
                properties:
                  statusCode:
                    type: number
                    example: 400
                  code:
                    type: string
                    enum:
                      - SELF_CHAT_NOT_ALLOWED
                  message:
                    type: string
                  extra:
                    type: object
                    nullable: true
        '401':
          description: Thiếu/sai/hết hạn access token (Authorization header)
          content:
            application/json:
              schema:
                properties:
                  statusCode:
                    type: number
                    example: 401
                  message:
                    type: string
        '403':
          description: >-
            Người gọi không phải chủ post cũng không phải người nhắn tin của
            room này (CHAT_PARTICIPANT_FORBIDDEN)
          content:
            application/json:
              schema:
                properties:
                  statusCode:
                    type: number
                    example: 403
                  code:
                    type: string
                    example: CHAT_PARTICIPANT_FORBIDDEN
                  message:
                    type: string
                  extra:
                    type: object
                    nullable: true
        '404':
          description: Post không tồn tại (POST_NOT_FOUND)
          content:
            application/json:
              schema:
                properties:
                  statusCode:
                    type: number
                    example: 404
                  code:
                    type: string
                    example: POST_NOT_FOUND
                  message:
                    type: string
                  extra:
                    type: object
                    nullable: true
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                properties:
                  statusCode:
                    type: number
                    example: 500
                  message:
                    type: string
                    example: Internal server error
      security:
        - access-token: []
      summary: Đánh dấu 1 room (postId + buyerProfileId) đã đọc đến thời điểm hiện tại
      tags: *ref_4
  /chats/unread-count:
    get:
      operationId: ChatController_getUnreadCount
      parameters: []
      responses:
        '200':
          description: Số room có tin nhắn chưa đọc
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/UnreadChatCountResponseDto'
                  meta:
                    type: object
                    additionalProperties: true
                    nullable: true
        '401':
          description: Thiếu/sai/hết hạn access token (Authorization header)
          content:
            application/json:
              schema:
                properties:
                  statusCode:
                    type: number
                    example: 401
                  message:
                    type: string
      security:
        - access-token: []
      summary: >-
        Lấy số lượng room có tin nhắn chưa đọc của user hiện tại (dùng cho badge
        icon chat)
      tags: *ref_4
info:
  title: Mekongo API
  description: Mekongo v4 API documentation
  version: 0.0.1
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    access-token:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    AccountResponseDto:
      type: object
      properties:
        id:
          type: string
        loginType:
          type: string
        status:
          type: string
        activeProfileId:
          type: string
          nullable: true
        blockUntil:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - loginType
        - status
        - activeProfileId
        - blockUntil
        - createdAt
        - updatedAt
    ChangeOwnPasswordRequestDto:
      type: object
      properties:
        oldPassword:
          type: string
        newPassword:
          type: string
      required:
        - oldPassword
        - newPassword
    UpdateAccountProfileRequestDto:
      type: object
      properties:
        profileId:
          type: string
        displayName:
          type: string
        avatarUrl:
          type: string
      required:
        - profileId
    AddressResponseDto:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        province:
          type: string
        provinceCode:
          type: number
        ward:
          type: string
        details:
          type: string
        profileId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - label
        - province
        - provinceCode
        - ward
        - details
        - profileId
        - createdAt
        - updatedAt
    SetProfileAddressRequestDto:
      type: object
      properties:
        profileId:
          type: string
        addressId:
          type: string
      required:
        - profileId
        - addressId
    CreateAddressRequestDto:
      type: object
      properties:
        label:
          type: string
        province:
          type: string
        provinceCode:
          type: number
        ward:
          type: string
        details:
          type: string
        profileId:
          type: string
      required:
        - label
        - province
        - provinceCode
        - ward
        - details
    DeleteAddressRequestDto:
      type: object
      properties:
        addressId:
          type: string
      required:
        - addressId
    ProfileResponseDto:
      type: object
      properties:
        id:
          type: string
        profileType:
          type: string
          enum:
            - INDIVIDUAL
            - DISTRIBUTOR
            - FACTORY
        accountId:
          type: string
        displayName:
          type: string
        avatarUrl:
          type: string
          nullable: true
        addressId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - profileType
        - accountId
        - displayName
        - avatarUrl
        - addressId
        - createdAt
        - updatedAt
    CreateProfileNewAddressDto:
      type: object
      properties:
        label:
          type: string
        province:
          type: string
        provinceCode:
          type: number
        ward:
          type: string
        details:
          type: string
      required:
        - label
        - province
        - provinceCode
        - ward
        - details
    CreateProfileRequestDto:
      type: object
      properties:
        profileType:
          type: string
          enum:
            - INDIVIDUAL
            - DISTRIBUTOR
            - FACTORY
        addressId:
          type: string
        newAddress:
          $ref: '#/components/schemas/CreateProfileNewAddressDto'
      required:
        - profileType
    SetActiveProfileRequestDto:
      type: object
      properties:
        profileId:
          type: string
      required:
        - profileId
    RegisterResponseDto:
      type: object
      properties:
        accountId:
          type: string
        otpId:
          type: string
        otpExpiredAt:
          type: string
          format: date-time
      required:
        - accountId
        - otpId
        - otpExpiredAt
    RegisterRequestDto:
      type: object
      properties:
        loginType:
          type: string
          enum:
            - EMAIL
            - PHONE
        identifier:
          type: string
        password:
          type: string
        profileType:
          type: string
          enum:
            - INDIVIDUAL
            - DISTRIBUTOR
            - FACTORY
        label:
          type: string
        province:
          type: string
        provinceCode:
          type: number
        ward:
          type: string
        details:
          type: string
      required:
        - loginType
        - identifier
        - password
        - profileType
        - label
        - province
        - provinceCode
        - ward
        - details
    ActivateRequestDto:
      type: object
      properties:
        identifier:
          type: string
        code:
          type: string
      required:
        - identifier
        - code
    ResetPasswordResponseDto:
      type: object
      properties:
        otpId:
          type: string
        otpExpiredAt:
          type: string
          format: date-time
      required:
        - otpId
        - otpExpiredAt
    ResetPasswordRequestDto:
      type: object
      properties:
        identifier:
          type: string
      required:
        - identifier
    ChangePasswordRequestDto:
      type: object
      properties:
        identifier:
          type: string
        code:
          type: string
        password:
          type: string
      required:
        - identifier
        - code
        - password
    LoginResponseDto:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        accountId:
          type: string
        profileId:
          type: string
          nullable: true
      required:
        - accessToken
        - refreshToken
        - accountId
        - profileId
    LoginRequestDto:
      type: object
      properties:
        loginType:
          type: string
          enum:
            - EMAIL
            - PHONE
        identifier:
          type: string
        password:
          type: string
      required:
        - loginType
        - identifier
        - password
    RefreshTokenResponseDto:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
      required:
        - accessToken
        - refreshToken
    RefreshTokenRequestDto:
      type: object
      properties:
        refreshToken:
          type: string
      required:
        - refreshToken
    LogoutRequestDto:
      type: object
      properties:
        refreshToken:
          type: string
      required:
        - refreshToken
    WsTokenResponseDto:
      type: object
      properties:
        wsToken:
          type: string
      required:
        - wsToken
    ReSendRequestDto:
      type: object
      properties:
        identifier:
          type: string
        purpose:
          type: string
          enum:
            - ACCOUNT_VERIFICATION
            - RESET_PASSWORD
      required:
        - identifier
        - purpose
    PostResponseDto:
      type: object
      properties:
        id:
          type: string
        postType:
          type: string
        title:
          type: string
        content:
          type: string
        images:
          type: array
          items:
            type: string
        provinceCode:
          type: number
        profileId:
          type: string
        likeCount:
          type: number
        commentCount:
          type: number
        createdAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - postType
        - title
        - content
        - images
        - provinceCode
        - profileId
        - likeCount
        - commentCount
        - createdAt
        - updatedAt
    CreatePostRequestDto:
      type: object
      properties:
        postType:
          type: string
          enum:
            - BUY
            - SELL
        title:
          type: string
        content:
          type: string
        images:
          type: array
          items:
            type: string
      required:
        - postType
        - title
        - content
        - images
    PreSignUploadResponseDto:
      type: object
      properties:
        keys:
          type: array
          items:
            type: string
        presignUrls:
          type: array
          items:
            type: string
      required:
        - keys
        - presignUrls
    PreSignUploadRequestDto:
      type: object
      properties:
        files:
          type: array
          items:
            type: string
      required:
        - files
    CommentResponseDto:
      type: object
      properties:
        id:
          type: string
        content:
          type: string
        parentId:
          type: string
          nullable: true
        postId:
          type: string
        profileId:
          type: string
        level:
          type: number
        createdAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - content
        - parentId
        - postId
        - profileId
        - level
        - createdAt
        - updatedAt
    CreateCommentRequestDto:
      type: object
      properties:
        content:
          type: string
        parentId:
          type: string
        postId:
          type: string
      required:
        - content
        - postId
    DeleteCommentRequestDto:
      type: object
      properties:
        commentId:
          type: string
      required:
        - commentId
    CommentAuthorResponseDto:
      type: object
      properties:
        profileId:
          type: string
        displayName:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
      required:
        - profileId
        - displayName
        - avatarUrl
    CommentListItemResponseDto:
      type: object
      properties:
        id:
          type: string
        content:
          type: string
        level:
          type: number
        parentId:
          type: string
          nullable: true
        childrenCount:
          type: number
          description: Số lượng comment con trực tiếp — chỉ có ở danh sách root
        author:
          $ref: '#/components/schemas/CommentAuthorResponseDto'
      required:
        - id
        - content
        - level
        - parentId
        - author
    NotificationActorResponseDto:
      type: object
      properties:
        profileId:
          type: string
        displayName:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
      required:
        - profileId
        - displayName
        - avatarUrl
    NotificationListItemResponseDto:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum:
            - NEW_COMMENT
            - NEW_REPLY
        actor:
          $ref: '#/components/schemas/NotificationActorResponseDto'
        postId:
          type: string
        commentId:
          type: string
        contentPreview:
          type: string
        isRead:
          type: boolean
        createdAt:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - type
        - actor
        - postId
        - commentId
        - contentPreview
        - isRead
        - createdAt
    UnreadNotificationCountResponseDto:
      type: object
      properties:
        unreadCount:
          type: number
      required:
        - unreadCount
    ToggleLikeRequestDto:
      type: object
      properties:
        postId:
          type: string
      required:
        - postId
    ChatParticipantResponseDto:
      type: object
      properties:
        profileId:
          type: string
        displayName:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
      required:
        - profileId
        - displayName
        - avatarUrl
    ChatRoomResponseDto:
      type: object
      properties:
        postId:
          type: string
        counterpart:
          $ref: '#/components/schemas/ChatParticipantResponseDto'
        lastMessageContent:
          type: string
        lastMessageAt:
          type: string
          format: date-time
      required:
        - postId
        - counterpart
        - lastMessageContent
        - lastMessageAt
    ChatMessageResponseDto:
      type: object
      properties:
        id:
          type: string
        postId:
          type: string
        ownerProfileId:
          type: string
        buyerProfileId:
          type: string
        senderProfileId:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - postId
        - ownerProfileId
        - buyerProfileId
        - senderProfileId
        - content
        - createdAt
    MarkChatAsReadRequestDto:
      type: object
      properties:
        postId:
          type: string
        buyerProfileId:
          type: string
      required:
        - postId
        - buyerProfileId
    UnreadChatCountResponseDto:
      type: object
      properties:
        unreadRooms:
          type: number
      required:
        - unreadRooms
