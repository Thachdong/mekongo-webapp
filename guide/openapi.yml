            field addressId/newAddress (code INVALID_PROFILE_ADDRESS_INPUT)
          content:
            application/json:
              schema:
                oneOf:
                  - properties:
                      statusCode:
                        type: number
                        example: 400
                      message:
                        type: array
                        items:
                          type: string
                      error:
                        type: string
                        example: Bad Request
                  - properties:
                      statusCode:
                        type: number
                        example: 400
                      code:
                        type: string
                        example: INVALID_PROFILE_ADDRESS_INPUT
