openapi: 3.0.0
paths:
  /:
    get:
      operationId: AppController_getHello
      parameters: []
      responses:
        '200':
          description: ''
      tags:
        - App
  /account:
    get:
      operationId: AccountController_getAccount
      parameters: []
      responses:
        '200':
          description: Thông tin account
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/AccountResponseDto'
                  meta:
                    type: object
                    additionalProperties: true
                    nullable: true
        '401':
          description: Thiếu/sai/hết hạn access token (Authorization header)
          content:
            application/json:
              schema:
                properties:
                  statusCode:
                    type: number
                    example: 401
                  message:
                    type: string
        '404':
          description: Account không tồn tại
          content:
            application/json:
              schema:
                properties:
                  statusCode:
                    type: number
                    example: 404
                  code:
                    type: string
                    example: ACCOUNT_NOT_FOUND
                  message:
                    type: string
                  extra:
                    type: object
                    nullable: true
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                properties:
                  statusCode:
                    type: number
                    example: 500
                  message:
                    type: string
                    example: Internal server error
      security:
        - access-token: []
      summary: Lấy thông tin account đang đăng nhập
      tags: &ref_0
        - account
  /account/change-password:
    post:
      operationId: AccountController_changePassword
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeOwnPasswordRequestDto'
      responses:
        '200':
          description: Đổi mật khẩu thành công
          content:
            application/json:
              schema:
                properties:
                  data:
                    type: object
                    nullable: true
                    example: null
                  meta:
                    type: object
                    additionalProperties: true
                    nullable: true
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                properties:
                  statusCode:
                    type: number
                    example: 400
                  message:
                    type: array
                    items:
                      type: string
                  error:
                    type: string
                    example: Bad Request
        '401':
          description: oldPassword không khớp mật khẩu hiện tại
          content:
            application/json:
              schema:
                properties:
                  statusCode:
                    type: number
                    example: 401
                  code:
                    type: string
                    example: INVALID_CURRENT_PASSWORD
                  message:
                    type: string
                    example: Current password is incorrect
                  extra:
                    type: object
                    nullable: true
        '404':
          description: Không tìm thấy account
          content:
            application/json:
              schema:
                properties:
                  statusCode:
                    type: number
                    example: 404
                  code:
                    type: string
                    example: ACCOUNT_NOT_FOUND
                  message:
                    type: string
                    example: Account not found
                  extra:
                    type: object
                    nullable: true
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                properties:
                  statusCode:
                    type: number
                    example: 500
                  message:
                    type: string
                    example: Internal server error
